# Attack pattern distributions for synthetic ATO event generation.
# Class overlap is mandatory — without it, the model learns trivially separable patterns.

credential_stuffing:
  failed_attempts_lambda: 12    # Poisson λ for ATO events
  normal_noise_lambda: 3        # 15% of normal events get λ=3-5
  normal_noise_rate: 0.15
  distinct_ips_lambda: 8

geo_anomaly:
  distance_mu: 7.0              # LogNormal parameters (ln-space)
  distance_sigma: 1.2
  legit_travel_rate: 0.10       # 10% of legit users travel legitimately

device_change:
  ato_new_device_prob: 0.85     # P(device_seen_flag=0) for ATO
  normal_new_device_rate: 0.20  # 20% of legit users change device

slow_brute_force:
  attempts_low: 3
  attempts_high: 8              # Uniform(3, 8) — overlaps with lockout-prone legit users

dormancy_exploit:
  gap_mu: 8.0                   # LogNormal parameters
  gap_sigma: 0.8
  # Legitimate reactivations overlap significantly

# Class imbalance
ato_rate: 0.03                  # ~3% of events are ATO (realistic)

# Noise injection rates
label_noise_rate: 0.02          # 2% of labels are intentionally flipped
feature_noise_std: 0.05         # Gaussian noise on continuous features
